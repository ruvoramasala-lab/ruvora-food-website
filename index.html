<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUVORA | Pure. Natural. Trust.</title><meta name="description" content="">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--green:#146c43;--dark:#123326;--light:#f5f8f4;--gold:#d8a83e}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:#183328}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e5e9e4}.top{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:23px;font-weight:800;color:var(--green)}.tag{font-size:11px;color:#66786d}.site-logo{width:46px;height:46px;object-fit:contain;border-radius:8px;margin-right:8px}.top>div:first-child{display:flex;align-items:center}.hero .site-banner{max-width:360px;max-height:180px;width:100%;object-fit:cover;border-radius:14px}.btn{border:0;border-radius:9px;background:var(--green);color:white;padding:11px 14px;font-weight:700;cursor:pointer}.btn.alt{background:#e9f0ea;color:var(--green)}.btn.gold{background:#a66b00}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{background:linear-gradient(120deg,#123326,#24734d);color:white;border-radius:18px;padding:32px 25px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{font-size:clamp(28px,5vw,48px);margin:0 0 8px}.hero p{margin:0 0 18px;color:#e6f3e9}.hero .badge{background:#ffffff1f;padding:10px 14px;border-radius:50%;font-size:60px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{background:#fff;border:1px solid #e5ebe5;border-radius:14px;padding:14px;box-shadow:0 3px 12px #1233260a}.product-img{height:150px;background:#edf4ed;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:12px}.product-img img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain}.price{font-weight:800;color:var(--green);font-size:19px}.muted{color:#718076;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{width:100%;padding:12px;border:1px solid #d7e1d8;border-radius:8px;margin:5px 0 10px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:18px;overflow:auto}.modalbox{max-width:600px;background:white;border-radius:16px;padding:20px;margin:40px auto}.cart-line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e5ebe5;padding:10px 0;align-items:center}.choice{border:1px solid #d7e1d8;border-radius:10px;padding:10px;margin:7px 0}.history{border:1px solid #e5ebe5;border-radius:10px;padding:12px;margin:8px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;gap:25px;padding:10px;z-index:6}nav button{border:0;background:transparent;color:var(--green);font-weight:700}main{padding-bottom:70px}footer{background:var(--dark);color:#d9e8dd;padding:28px 18px;margin-top:35px}footer .wrap{padding:0}small{font-size:11px}
</style></head><body>
<header><div class="top"><div><img id="siteLogo" class="site-logo hidden" alt="RUVORA Logo"><div class="brand" id="brand">RUVORA</div><div class="tag" id="slogan">Pure. Natural. Trust.</div></div><div class="row"><button class="btn alt" onclick="openCart()">Cart (<span id="cartCount">0</span>)</button><button class="btn" onclick="openAccount()">Account</button></div></div></header>
<main><div class="wrap"><section class="hero"><div><h1 id="heroTitle">Pure Food. Honest Trust.</h1><p id="heroText">Quality spices and natural foods for your family.</p><button class="btn" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Shop Now</button></div><div class="badge" id="heroMedia">🌿</div></section>
<div class="section-title"><h2>Our Products</h2><button class="btn alt" onclick="loadProducts()">Refresh</button></div><div id="products" class="grid"><div class="card">Loading products...</div></div>
<div class="section-title"><h2>Contact & Message</h2></div><div class="card"><p id="contactInfo">For order support, contact us.</p><button class="btn" onclick="openMessage()">Send Message</button></div></div></main>
<footer><div class="wrap"><b id="footerName">RUVORA FOOD</b><p id="footerText">Pure. Natural. Trust.</p><small id="footerContact"></small></div></footer>
<nav><button onclick="scrollTo(0,0)">Home</button><button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Categories</button><button onclick="openSearch()">Search</button><button onclick="openCart()">Cart</button><button onclick="openAccount()">Account</button></nav>

<div class="modal" id="productModal"><div class="modalbox"><div class="row" style="justify-content:space-between"><h2 id="detailName">Product</h2><button class="btn alt" onclick="closeModals()">Close</button></div><div id="detailBody"></div><div id="commentArea"></div></div></div>
<div class="modal" id="cartModal"><div class="modalbox"><div class="row" style="justify-content:space-between"><h2>Your Cart</h2><button class="btn alt" onclick="closeModals()">Close</button></div><div id="cartItems"></div><h3 id="cartTotal">Total: ৳0</h3><button class="btn" onclick="openCheckout()">Checkout</button></div></div>
<div class="modal" id="checkoutModal"><div class="modalbox"><div class="row" style="justify-content:space-between"><h2>Checkout</h2><button class="btn alt" onclick="closeModals()">Close</button></div><div id="paymentInfoBox" class="choice"></div><form onsubmit="placeOrder(event)"><label>Full Name</label><input class="field" id="cName" required><label>Phone</label><input class="field" id="cPhone" required><label>Delivery Address</label><textarea class="field" id="cAddress" required></textarea><label>Payment Method</label><select class="field" id="cPayment" onchange="showPaymentInstruction()"></select><div id="paymentInstruction" class="choice"></div><label id="refLabel" style="display:none">Transaction / Payment Reference</label><input class="field" id="cReference" placeholder="Optional transaction ID" style="display:none"><button class="btn" id="placeOrderBtn" type="submit">Place Order</button></form></div></div>
<div class="modal" id="accountModal"><div class="modalbox"><div class="row" style="justify-content:space-between"><h2>My Account</h2><button class="btn alt" onclick="closeModals()">Close</button></div><div id="accountBody"></div></div></div>
<div class="modal" id="messageModal"><div class="modalbox"><div class="row" style="justify-content:space-between"><h2>Send Message</h2><button class="btn alt" onclick="closeModals()">Close</button></div><form onsubmit="sendMessage(event)"><input class="field" id="mName" placeholder="Name" required><input class="field" id="mPhone" placeholder="Phone" required><textarea class="field" id="mText" placeholder="Your message" required></textarea><button class="btn">Send Message</button></form></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAA3Q7WYPRHEZQaxHJ1rcz_OUOtUcRQ68k",authDomain:"ruvora-food.firebaseapp.com",projectId:"ruvora-food",storageBucket:"ruvora-food.firebasestorage.app",messagingSenderId:"111801740589",appId:"1:111801740589:web:c6b888e615ad141e2977a4",measurementId:"G-6QRCCDNCEM"};
let db,auth,settings={},products=[],cart=JSON.parse(localStorage.getItem('ruvoraCart')||'[]'),selectedProduct=null;
try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();auth=firebase.auth()}catch(e){console.error(e)}
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.style.display='none')}function show(id){closeModals();$(id).style.display='block'}
async function loadSettings(){
 if(!db)return;
 try{
  let s=await db.collection('siteSettings').doc('main').get();if(!s.exists)s=await db.collection('settings').doc('main').get();if(!s.exists)return;
  settings=s.data()||{};const val=(...keys)=>{for(const k of keys){if(settings[k]!==undefined&&settings[k]!==null&&String(settings[k]).trim()!=='')return settings[k]}return ''};
  $('brand').textContent=val('companyName','brandName')||'RUVORA';$('slogan').textContent=val('slogan')||'Pure. Natural. Trust.';
  $('heroTitle').textContent=val('homeHeading','bannerTitle','heroTitle')||'Pure Food. Honest Trust.';$('heroText').textContent=val('homeSubtitle','bannerText','heroText')||'Quality spices and natural foods for your family.';
  $('footerName').textContent=val('companyName','brandName')||'RUVORA FOOD';$('footerText').textContent=val('footer','slogan')||'Pure. Natural. Trust.';
  $('footerContact').textContent=[val('address'),val('phone1'),val('email')].filter(Boolean).join(' | ');$('contactInfo').textContent=[val('phone1'),val('phone2'),val('whatsapp'),val('email')].filter(Boolean).join(' | ')||'For order support, contact us.';
  const logo=val('logo');if(logo){$('siteLogo').src=logo;$('siteLogo').classList.remove('hidden')}const banner=val('banner');if(banner)$('heroMedia').innerHTML='<img class="site-banner" src="'+esc(banner)+'" alt="RUVORA Banner">';
  if(val('seoTitle'))document.title=val('seoTitle');let meta=document.querySelector('meta[name="description"]');if(!meta){meta=document.createElement('meta');meta.name='description';document.head.appendChild(meta)}meta.content=val('seoDescription');
 }catch(e){console.warn(e)}
}
function isOutOfStock(p){const s=String(p.stockStatus||'').trim().toLowerCase();return s==='out of stock'||s==='stock out'||s==='out-of-stock'||s==='out'||Number(p.stock||0)<=0}
async function loadProducts(){const box=$('products');box.innerHTML='<div class="card">Loading products...</div>';try{const snap=await db.collection('products').get();products=snap.docs.map(d=>({id:d.id,...d.data()}));products.sort((a,b)=>(a.name||a.productName||'').localeCompare(b.name||b.productName||''));box.innerHTML=products.length?products.map(p=>{const img=p.image||p.imageUrl||'',out=isOutOfStock(p);return `<div class="card" onclick="openProduct('${p.id}')"><div class="product-img">${img?`<img src="${esc(img)}" alt="${esc(p.name||'Product')}">`:(esc(p.emoji||'🌾'))}</div><h3>${esc(p.name||p.productName||'Product')}</h3><p class="muted">${esc(p.category||'')}</p><p class="muted">${esc(p.description||'Pure and carefully prepared.')}</p><div class="price">৳${Number(p.price||p.retailPrice||0)}</div><p class="muted">${esc(p.weight||p.packageSize||p.size||'')}</p><p class="muted">${esc(p.stockStatus||(out?'Out of Stock':'Stock Available'))}</p><div class="row" onclick="event.stopPropagation()"><button class="btn" ${out?'disabled':''} onclick="addToCart('${p.id}')">Add to Cart</button><button class="btn gold" ${out?'disabled':''} onclick="instantBuy('${p.id}')">Instant Buy</button></div></div>`}).join(''):'<div class="card">No products available yet.</div>'}catch(e){box.innerHTML='<div class="card">Products could not be loaded: '+esc(e.message||e)+'</div>';console.error(e)}}
function addToCart(id){let p=products.find(x=>x.id===id);if(!p)return;let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,name:p.name||p.productName,price:Number(p.price||p.retailPrice||0),weight:p.weight||p.packageSize||p.size||'',qty:1});saveCart();alert('Added to cart')}
function instantBuy(id){let p=products.find(x=>x.id===id);if(!p)return;cart=[{id,name:p.name||p.productName,price:Number(p.price||p.retailPrice||0),weight:p.weight||p.packageSize||p.size||'',qty:1}];saveCart();openCheckout()}
function saveCart(){localStorage.setItem('ruvoraCart',JSON.stringify(cart));$('cartCount').textContent=cart.reduce((a,x)=>a+x.qty,0)}
function openCart(){show('cartModal');let total=0;$('cartItems').innerHTML=cart.length?cart.map((x,i)=>{total+=x.price*x.qty;return `<div class="cart-line"><span>${esc(x.name)} ${esc(x.weight)} × ${x.qty}</span><b>৳${x.price*x.qty}</b><button class="btn alt" onclick="removeItem(${i})">×</button></div>`}).join(''):'Your cart is empty.';$('cartTotal').textContent='Total: ৳'+total}
function removeItem(i){cart.splice(i,1);saveCart();openCart()}
function openCheckout(){if(!cart.length)return alert('Your cart is empty');populateCheckout();show('checkoutModal')}
async function populateCheckout(){const u=auth.currentUser;if(u){try{const d=await db.collection('customers').doc(u.uid).get();if(d.exists){const x=d.data();$('cName').value=x.name||'';$('cPhone').value=x.phone||'';$('cAddress').value=x.address||''}}catch(e){}}const val=(...keys)=>{for(const k of keys){if(settings[k]!==undefined&&settings[k]!==null&&String(settings[k]).trim()!=='')return String(settings[k]).trim()}return ''};const bk=val('bkash','bkashNumber','bkashAccount'),ng=val('nagad','nagadNumber','nagadAccount'),bank=val('bank','bankAccount','bankDetails');let opts=[];if(settings.cod!==false)opts.push(['Cash on Delivery','Pay cash when your order is delivered.']);if(bk)opts.push(['bKash',bk]);if(ng)opts.push(['Nagad',ng]);if(bank)opts.push(['Bank Account',bank]);if(!opts.length)opts.push(['Cash on Delivery','Payment method is not configured yet.']);$('cPayment').innerHTML=opts.map(o=>`<option value="${esc(o[0])}">${esc(o[0])}</option>`).join('');$('paymentInfoBox').innerHTML='<b>Delivery charge:</b> ৳'+Number(settings.deliveryCharge||0)+(settings.freeDeliveryMinimum?' — Free delivery from ৳'+Number(settings.freeDeliveryMinimum):'');showPaymentInstruction()}
function showPaymentInstruction(){const m=$('cPayment').value;const val=(...keys)=>{for(const k of keys){if(settings[k]!==undefined&&settings[k]!==null&&String(settings[k]).trim()!=='')return String(settings[k]).trim()}return ''};let text='';if(m==='bKash')text=val('bkash','bkashNumber','bkashAccount');else if(m==='Nagad')text=val('nagad','nagadNumber','nagadAccount');else if(m==='Bank Account')text=val('bank','bankAccount','bankDetails');else text='No advance payment required.';$('paymentInstruction').innerHTML=esc(text).replace(/\n/g,'<br>');const needs=m!=='Cash on Delivery';$('cReference').style.display=needs?'block':'none';$('refLabel').style.display=needs?'block':'none'}
async function saveCustomerProfile(data){const u=auth.currentUser;if(!u)return;await db.collection('customers').doc(u.uid).set({...data,email:u.email||'',updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}
async function placeOrder(e){e.preventDefault();const btn=$('placeOrderBtn');btn.disabled=true;btn.innerText='Placing...';const total=cart.reduce((a,x)=>a+x.price*x.qty,0);const u=auth.currentUser;const data={uid:u?u.uid:null,email:u?u.email:null,customerName:$('cName').value.trim(),phone:$('cPhone').value.trim(),address:$('cAddress').value.trim(),paymentMethod:$('cPayment').value,paymentReference:$('cReference').value.trim(),items:cart,total,deliveryCharge:Number(settings.deliveryCharge||0),status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()};try{await db.collection('orders').add(data);if(u)await saveCustomerProfile({name:data.customerName,phone:data.phone,address:data.address});cart=[];saveCart();closeModals();alert('Order placed successfully. Our team will contact you soon.')}catch(err){alert('Order could not be placed: '+err.message)}finally{btn.disabled=false;btn.innerText='Place Order'}}
function openProduct(id){selectedProduct=products.find(x=>x.id===id);if(!selectedProduct)return;const out=isOutOfStock(selectedProduct);$('detailName').textContent=selectedProduct.name||selectedProduct.productName||'Product';const img=selectedProduct.image||selectedProduct.imageUrl||'';$('detailBody').innerHTML=(img?`<div class="product-img"><img src="${esc(img)}"></div>`:`<div class="product-img">${esc(selectedProduct.emoji||'🌾')}</div>`)+`<p>${esc(selectedProduct.description||'')}</p><p class="muted">Category: ${esc(selectedProduct.category||'')}<br>Size: ${esc(selectedProduct.weight||selectedProduct.packageSize||selectedProduct.size||'')}<br>Status: ${esc(selectedProduct.stockStatus||(out?'Out of Stock':'Stock Available'))}</p><h3 class="price">৳${Number(selectedProduct.price||selectedProduct.retailPrice||0)}</h3><div class="row"><button class="btn" ${out?'disabled':''} onclick="addToCart('${selectedProduct.id}')">Add to Cart</button><button class="btn gold" ${out?'disabled':''} onclick="instantBuy('${selectedProduct.id}')">Instant Buy</button></div>`;loadComments(selectedProduct.id);show('productModal')}
async function loadComments(pid){let html='<h3>Customer Comments</h3>';try{const s=await db.collection('productComments').where('productId','==',pid).get();s.forEach(d=>{const x=d.data();html+=`<div class="history"><b>${esc(x.name||'Customer')}</b><div>${esc(x.text||'')}</div></div>`})}catch(e){}if(auth.currentUser)html+=`<textarea class="field" id="newComment" placeholder="Write your comment"></textarea><button class="btn" onclick="postComment('${pid}')">Post Comment</button>`;else html+='<p class="muted">Login to post a comment.</p>';$('commentArea').innerHTML=html}
async function postComment(pid){const text=$('newComment').value.trim(),u=auth.currentUser;if(!u||!text)return;let name=u.email||'Customer';try{const c=await db.collection('customers').doc(u.uid).get();if(c.exists)name=c.data().name||name;await db.collection('productComments').add({productId:pid,uid:u.uid,name,text,createdAt:firebase.firestore.FieldValue.serverTimestamp()});loadComments(pid)}catch(e){alert(e.message)}}
function openAccount(){show('accountModal');renderAccount()}
async function renderAccount(){const u=auth.currentUser;if(!u){$('accountBody').innerHTML=`<form onsubmit="login(event)"><input class="field" id="aEmail" type="email" placeholder="Email" required><input class="field" id="aPassword" type="password" placeholder="Password" required><button class="btn">Login</button></form><hr><h3>Create Account</h3><input class="field" id="sName" placeholder="Full Name"><input class="field" id="sPhone" placeholder="Phone"><textarea class="field" id="sAddress" placeholder="Address"></textarea><input class="field" id="sEmail" type="email" placeholder="Email"><input class="field" id="sPassword" type="password" placeholder="Password (6+ characters)"><button class="btn" onclick="signup()">Create Account</button>`;return}let c={};try{const d=await db.collection('customers').doc(u.uid).get();if(d.exists)c=d.data()}catch(e){}let orders=[],messages=[],comments=[];try{let q=await db.collection('orders').where('uid','==',u.uid).get();q.forEach(d=>orders.push(d.data()));q=await db.collection('messages').where('uid','==',u.uid).get();q.forEach(d=>messages.push(d.data()));q=await db.collection('productComments').where('uid','==',u.uid).get();q.forEach(d=>comments.push(d.data()))}catch(e){}$('accountBody').innerHTML=`<div class="card"><h3>${esc(c.name||u.email)}</h3><p class="muted">${esc(u.email||'')}</p><p>${esc(c.phone||'')}<br>${esc(c.address||'')}</p><button class="btn" onclick="logoutCustomer()">Logout</button></div><h3>My Orders (${orders.length})</h3>${orders.map(o=>`<div class="history"><b>৳${Number(o.total||0)}</b> — ${esc(o.status||'pending')}<br>${esc(o.paymentMethod||'')}<br><span class="muted">${esc(o.customerName||'')}</span></div>`).join('')||'<p class="muted">No orders yet.</p>'}<h3>My Messages (${messages.length})</h3>${messages.map(m=>`<div class="history"><b>You:</b> ${esc(m.message||'')}<br><b>Reply:</b> ${esc(m.reply||'No reply yet')}</div>`).join('')||'<p class="muted">No messages yet.</p>'}<h3>My Product Comments (${comments.length})</h3>${comments.map(m=>`<div class="history">${esc(m.text||'')}</div>`).join('')||'<p class="muted">No comments yet.</p>'}`}
async function login(e){e.preventDefault();try{await auth.signInWithEmailAndPassword($('aEmail').value.trim(),$('aPassword').value);renderAccount()}catch(e){alert(e.message)}}
async function signup(){const email=$('sEmail').value.trim(),password=$('sPassword').value;if(!email||password.length<6)return alert('Email দিন এবং Password কমপক্ষে 6 অক্ষরের দিন।');try{const cred=await auth.createUserWithEmailAndPassword(email,password);await db.collection('customers').doc(cred.user.uid).set({name:$('sName').value.trim(),phone:$('sPhone').value.trim(),address:$('sAddress').value.trim(),email,createdAt:firebase.firestore.FieldValue.serverTimestamp()});alert('Account created successfully');renderAccount()}catch(e){alert(e.message)}}
function logoutCustomer(){auth.signOut();closeModals()}
function openMessage(){const u=auth.currentUser;if(u){$('mName').value='';$('mPhone').value='';}show('messageModal')}
async function sendMessage(e){e.preventDefault();const u=auth.currentUser;try{await db.collection('messages').add({uid:u?u.uid:null,email:u?u.email:null,name:$('mName').value.trim(),phone:$('mPhone').value.trim(),message:$('mText').value.trim(),status:'unread',createdAt:firebase.firestore.FieldValue.serverTimestamp()});alert('Message sent');$('mText').value='';closeModals()}catch(err){alert(err.message)}}
function openSearch(){let q=prompt('Search product');if(!q)return;let found=products.filter(p=>(p.name||p.productName||'').toLowerCase().includes(q.toLowerCase()));alert(found.length?found.map(p=>p.name||p.productName).join('\n'):'No matching product found')}
auth.onAuthStateChanged(()=>{if($('accountModal').style.display==='block')renderAccount()})
(async()=>{saveCart();await loadSettings();await loadProducts()})();
</script></body></html>
